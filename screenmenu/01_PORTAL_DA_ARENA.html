<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Legiões das Armadilhas | Portal da Arena</title><style>:root{--n:#090d2c;--v:#7c32ff;--c:#09d7ff;--g:#ffb10e;--w:#fbfbff;--m:#c4c8ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b29;color:var(--w);font-family:system-ui,sans-serif}.app{width:min(100%,470px);min-height:100svh;padding:20px;overflow:hidden;background:radial-gradient(circle at 50% 28%,#3b1ba3 0 8%,transparent 32%),radial-gradient(circle at 10% 75%,#00cfff35,transparent 30%),linear-gradient(155deg,#0c1242,#17105e 52%,#090c30)}.top{display:flex;justify-content:space-between;align-items:center}.profile{display:flex;align-items:center;gap:9px}.avatar{width:41px;height:41px;display:grid;place-items:center;border:2px solid #ffe165;border-radius:14px;background:linear-gradient(135deg,#ffcc36,#a343ff);box-shadow:0 0 20px #ffbc2e77}.name{font-size:13px;font-weight:900}.level{font-size:10px;color:var(--m);margin-top:2px}.settings{border:1px solid #8588db75;background:#17155390;color:#fff;border-radius:14px;width:42px;height:42px;font-size:19px}.title{text-align:center;margin:24px 0 10px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:2px;color:#8ff0ff}.title h1{font-size:34px;line-height:.94;letter-spacing:-1.5px;margin:8px 0;text-shadow:0 5px #090d2c,0 0 30px #b75dff77}.title h1 span{display:block;color:#ffe165}.arena{height:210px;border:1px solid #7c88ef83;border-radius:31px;position:relative;overflow:hidden;background:linear-gradient(180deg,#3520a3aa,#0a1163 55%,#080a2d);box-shadow:inset 0 0 55px #bd4cff35,0 18px 38px #03051b66}.floor{position:absolute;width:145%;height:112px;left:-22%;bottom:-45px;background:repeating-linear-gradient(90deg,#09558a 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,#09558a 0 1px,transparent 1px 27px),linear-gradient(#1cc3ed,#095688);transform:perspective( :25px;margin-top:19px;color:#aeb2e4;font-size:10px}.bottom span{display:grid;justify-items:center;gap:4px}.bottom b{font-size:18px;color:#e8e9ff}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.18)}}@keyframes wave{50%{transform:skewY(-7deg)}}@media(max-height:730px){.title{margin:12px 0 5px}.arena{height:158px}.play{min-height:56px}.mode{min-height:96px}}</style></head><body><main class="app"><header class="top"><div class="profile"><div class="avatar">⚔</div><div><div class="name">COMANDANTE</div><div class="level">Nível 01 · Liga Iniciante</div></div></div><button class="settings">⚙</button></header><section class="title"><div class="eyebrow">O CORAÇÃO DO IMPACTO CHAMA</div><h1>LEGIÕES DAS <span>ARMADILHAS</span></h1></section><section class="arena"><div class="flag f1"></div><div class="flag f2"></div><div class="tower left"></div><div class="tower right"></div><div class="portal"></div><div class="floor"></div></section><button class="play">▶ &nbsp; JOGAR AGORA</button><p class="hint">Entre na arena ou prepare o próximo impacto.</p><section class="modes"><button class="mode"><div class="glyph">🎯</div><h2>Arena de Treino</h2><p>Teste criaturas e domine os impactos.</p><b class="arrow">→</b></button><button class="mode free"><div class="glyph">⚔</div><h2>Jogo Livre</h2><p>Monte seu time e entre na batalha.</p><b class="arrow">→</b></button></section><nav class="bottom"><span><b>⌂</b>Início</span><span><b>▧</b>Coleção</span><span><b>✦</b>Missões</span></nav></main></body></html>
