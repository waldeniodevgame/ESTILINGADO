<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ESTILINGADO</title><style>body{margin:0;background:#081411;color:#fff;font:15px system-ui;text-align:center}.top{padding:12px}.hint{color:#b6cbc2;font-size:13px}button{padding:10px 15px;border:1px solid #78b399;border-radius:9px;background:#183b30;color:white;font-weight:700;margin:6px}canvas{width:min(94vw,900px);border:2px solid #447565;border-radius:14px;background:#1c392f;touch-action:none;transform-origin:center}.shake{animation:s .18s linear}@keyframes s{20%{transform:translate(-10px,5px)}50%{transform:translate(11px,-5px)}75%{transform:translate(-6px,3px)}}#toast{height:25px;font-weight:800;color:#ffe28a}</style><div class='top'><b>ESTILINGADO · Impacto Cinemático</b><div class='hint'>Arraste o monstro azul para trás e solte contra o vermelho. Ou clique em Testar Impacto.</div><button id='demo'>TESTAR IMPACTO</button><button id='reset'>REINICIAR</button><div id='toast'></div></div><canvas id='c' width='900' height='500'></canvas><script>const c=document.querySelector('#c'),x=c.getContext('2d'),toast=document.querySelector('#toast');let A,B,down,last=0,freeze=0,slow=0,cam,flash,particles=[];function reset(){A={x:190,y:300,vx:0,vy:0,team:'AZUL',hp:100};B={x:670,y:250,vx:0,vy:0,team:'VERMELHO',hp:100};down=null;particles=[];cam=flash=null;draw()}function impact(X,Y,power=12){let t=performance.now();freeze=t+70;slow=t+360;cam={x:X,y:Y,t,d:360};flash={t,d:170};particles=Array.from({length:24},(_,i)=>({a:i*Math.PI/12,v:5+Math.random()*9,l:1}));toast.textContent='IMPACTO FORTE · HIT STOP + SLOW MOTION';c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}function bg(){x.fillStyle='#18382e';x.fillRect(0,0,900,500);x.strokeStyle='rgba(255,255,255,.04)';for(let i=0;i<900;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,500);x.stroke()}x.fillStyle='#536354';x.fillRect(425,80,50,125);x.fillRect(425,300,50,120)}function unit(u){x.beginPath();x.arc(u.x,u.y,31,0,7);x.fillStyle=u.team==='AZUL'?'#35a6ff':'#ff5c56';x.fill();x.lineWidth=4;x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='bold 14px system-ui';x.textAlign='center';x.fillText(u.team,u.x,u.y+5);x.fillStyle='#111';x.fillRect(u.x-34,u.y-49,68,7);x.fillStyle=u.team==='AZUL'?'#79d7ff':'#ffaaa4';x.fillRect(u.x-34,u.y-49,68*u.hp/100,7)}function draw(t=performance.now()){x.clearRect(0,0,900,500);let z=1,cx=450,cy=250;if(cam){let p=(t-cam.t)/cam.d;if(p>1)cam=null;else{z=1+.25*Math.sin(p*Math.PI);cx=cam.x;cy=cam.y}}x.save();x.translate(450,250);x.scale(z,z);x.translate(-cx,-cy);bg();unit(A);unit(B);if(down){x.beginPath();x.moveTo(A.x,A.y);x.lineTo(down.x,down.y);x.strokeStyle='white';x.lineWidth=5;x.stroke()}particles.forEach(q=>{x.globalAlpha=q.l;x.strokeStyle='#ffe48a';x.lineWidth=4;x.beginPath();x.moveTo(B.x+Math.cos(q.a)*30,B.y+Math.sin(q.a)*30);x.lineTo(B.x+Math.cos(q.a)*(30+q.v*5),B.y+Math.sin(q.a)*(30+q.v*5));x.stroke()});x.globalAlpha=1;x.restore();if(flash){let p=(t-flash.t)/flash.d;if(p>1)flash=null;else{x.fillStyle='rgba(255,220,110,'+(.42*(1-p))+')';x.fillRect(0,0,900,500)}}}function loop(t){let dt=last?Math.min(2,(t-last)/16):1;last=t;if(t<freeze){draw(t);requestAnimationFrame(loop);return}let s=t<slow?.35:1;A.x+=A.vx*s;A.y+=A.vy*s;B.x+=B.vx*s;B.y+=B.vy*s;for(let u of[A,B]){u.vx*=.975;u.vy*=.975;u.x=Math.max(31,Math.min(869,u.x));u.y=Math.max(31,Math.min(469,u.y))}let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d<62){let nx=dx/d,ny=dy/d,force=Math.max(0,(A.vx-B.vx)*nx+(A.vy-B.vy)*ny);if(force>2&&!A.hit){A.hit=true;B.hp=Math.max(0,B.hp-Math.round(force*3));impact((A.x+B.x)/2,(A.y+B.y)/2,force)}let ov=(62-d)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;A.vx-=force*nx*.9;A.vy-=force*ny*.9;B.vx+=force*nx*.9;B.vy+=force*ny*.9}else A.hit=false;particles.forEach(q=>q.l-=.035*dt);particles=particles.filter(q=>q.l>0);draw(t);requestAnimationFrame(loop)}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*500/r.height}}c.onpointerdown=e=>{let p=pos(e);if(Math.hypot(p.x-A.x,p.y-A.y)<55)down=p};c.onpointermove=e=>{if(down)down=pos(e)};c.onpointerup=e=>{if(!down)return;let p=pos(e),dx=p.x-A.x,dy=p.y-A.y,m=Math.hypot(dx,dy)||1;A.vx=-dx/m*Math.min(18,m/10);A.vy=-dy/m*Math.min(18,m/10);down=null};document.querySelector('#demo').onclick=()=>{B.x=520;B.y=250;A.x=430;A.y=250;A.vx=14;A.vy=0;A.hit=false;toast.textContent='Demo iniciado: prepare os olhos.'};document.querySelector('#reset').onclick=reset;reset();requestAnimationFrame(loop);</script></html>
